services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pco
      POSTGRES_PASSWORD: pco
      POSTGRES_DB: pco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: npm run start:dev
    environment:
      DATABASE_URL: postgres://pco:pco@db:5432/pco
      PORT: 3000
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./reference:/app/reference:ro

    depends_on:
      - db

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
